<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="never-late logo">
  <title>never-late</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <circle cx="120" cy="120" r="74" fill="#FFFFFF"/>
  </g>
  <!-- one-minute arc: the last minute before the meeting -->
  <path d="M120 46 A74 74 0 0 1 157 56" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#CBD5E1" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="62" x2="120" y2="72"/>
    <line x1="120" y1="168" x2="120" y2="178"/>
    <line x1="62" y1="120" x2="72" y2="120"/>
    <line x1="168" y1="120" x2="178" y2="120"/>
  </g>
  <!-- hands: minute hand straight up, hour hand pointing at the top of the hour -->
  <line x1="120" y1="120" x2="120" y2="74" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="146" y2="108" stroke="#475569" stroke-width="9" stroke-linecap="round" transform="rotate(-24 120 120)"/>
  <circle cx="120" cy="120" r="9" fill="#1E293B"/>
  <!-- video-call badge -->
  <g filter="url(#shadow)">
    <circle cx="190" cy="190" r="42" fill="url(#badge)" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <rect x="168" y="175" width="28" height="30" rx="7" fill="#FFFFFF"/>
  <path d="M199 185 L213 177 V203 L199 195 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
</svg>
